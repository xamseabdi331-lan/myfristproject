
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #10172a, #253b65);
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #38bdf8;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            color: #38bdf8;
        }

        .hero {
            text-align: center;
            padding: 110px 20px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .hero span {
            color: #38bdf8;
        }

        .hero p {
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #38bdf8;
            color: #10172a;
            padding: 13px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: white;
            transform: translateY(-4px);
        }

        .card {
            background: #1e293b;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <header>
        <h2>MyWebsite.</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to <span>My Website</span></h1>

        <p>
            Learning today, building tomorrow.
            <br>
            This is my first HTML project.
        </p>

        <a href="#about" class="btn">Explore More</a>
    </section>

    <section class="card" id="about">
        <h2>About My Project</h2>

        <p>
            I am learning HTML, CSS and JavaScript
            to become a professional developer.
        </p>
    </section>

    <footer>
        <p>© 2026 MyWebsite. All Rights Reserved.</p>
    </footer>

</body>
</html>
